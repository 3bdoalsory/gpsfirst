{% extends "base.html" %}{% block head %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>{% endblock %}
{% block content %}<div class="page"><div class="page-title"><div><small>TRIP HISTORY</small><h1>{{device.name}} · ID {{device.platform_id}}</h1></div><a class="ghost" href="/dashboard">← العودة</a></div>
<div class="history-toolbar glass"><label>من <span class="date-time-pair"><input id="sd" class="date-input smart-date" placeholder="DD/MM/YYYY" inputmode="numeric"><input id="st" class="time-input smart-time" placeholder="HH:MM أو 2:30 PM"></span></label><label>إلى <span class="date-time-pair"><input id="ed" class="date-input smart-date" placeholder="DD/MM/YYYY" inputmode="numeric"><input id="et" class="time-input smart-time" placeholder="HH:MM أو 2:30 PM"></span></label><button id="load">عرض المسار</button><button id="play">▶ تشغيل</button><label><input id="show" type="checkbox" checked> نقاط التوقف</label></div>
<div class="history-grid"><div class="history-map-wrap glass"><div id="hmap"></div><div class="speed-legend map-legend"><span><i class="green"></i> أقل من 40</span><span><i class="yellow"></i> 40–90</span><span><i class="red"></i> فوق 90 km/h</span></div></div>
<div class="speed-chart-card glass"><div class="chart-title"><div><small>SPEED PROFILE</small><h3>السرعة مع الزمن</h3></div><div class="speed-legend"><span><i class="green"></i> &lt;40</span><span><i class="yellow"></i> 40–90</span><span><i class="red"></i> &gt;90</span></div></div><canvas id="speedChart"></canvas></div></div>
<div id="summary" class="glass summary"></div></div>{% endblock %}
{% block scripts %}<script>
const m=L.map('hmap').setView([33.97,36.67],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);let pts=[],segments=[],car,stops=L.layerGroup().addTo(m);
function iso(d,t){d=normalizeSmartDate(d);t=normalizeSmartTime(t);let p=d.split('/');if(p.length!==3||!/^\d{2}:\d{2}$/.test(t))return null;return `${p[2]}-${p[1]}-${p[0]}T${t}`};function fd(v){if(!v)return '-';let z=v.replace('T',' ').split(' '),d=z[0].split('-');return d.length===3?`${d[2]}/${d[1]}/${d[0]}${z[1]?' '+z[1].slice(0,5):''}`:v}
function mix(a,b,t){let A=a.match(/\w\w/g).map(x=>parseInt(x,16)),B=b.match(/\w\w/g).map(x=>parseInt(x,16));return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function speedColor(s){s=Number(s||0);if(s<=34)return '#33c46f';if(s<46)return mix('33c46f','f1c84b',(s-34)/12);if(s<=84)return '#f1c84b';if(s<96)return mix('f1c84b','ef5350',(s-84)/12);return '#ef5350'}
function clearSegments(){segments.forEach(x=>m.removeLayer(x));segments=[]}
function drawRoute(){clearSegments();for(let i=1;i<pts.length;i++){let s=(Number(pts[i-1].speed||0)+Number(pts[i].speed||0))/2;segments.push(L.polyline([[pts[i-1].latitude,pts[i-1].longitude],[pts[i].latitude,pts[i].longitude]],{weight:6,opacity:.88,color:speedColor(s),lineCap:'round'}).addTo(m))}if(pts.length){m.fitBounds(L.latLngBounds(pts.map(p=>[p.latitude,p.longitude])),{padding:[25,25]})}}
function drawChart(){
 const c=speedChart,box=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=Math.max(600,box.width*dpr);c.height=280*dpr;let ctx=c.getContext('2d');ctx.scale(dpr,dpr);let W=c.width/dpr,H=c.height/dpr,pad={l:52,r:18,t:24,b:42};ctx.clearRect(0,0,W,H);
 let speeds=pts.map(p=>Number(p.speed||0)),max=Math.max(110,...speeds);ctx.strokeStyle='rgba(190,220,240,.18)';ctx.fillStyle='#9cb7ca';ctx.font='12px system-ui';
 for(let i=0;i<=5;i++){let y=pad.t+(H-pad.t-pad.b)*i/5;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();let val=Math.round(max*(1-i/5));ctx.fillText(val,8,y+4)}
 if(pts.length<2){ctx.fillText('لا توجد نقاط كافية للرسم',pad.l+20,H/2);return}
 let x=i=>pad.l+(W-pad.l-pad.r)*i/(pts.length-1),y=s=>pad.t+(H-pad.t-pad.b)*(1-s/max);
 ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
 for(let i=1;i<pts.length;i++){let s1=speeds[i-1],s2=speeds[i],g=ctx.createLinearGradient(x(i-1),0,x(i),0);g.addColorStop(0,speedColor(s1));g.addColorStop(1,speedColor(s2));ctx.strokeStyle=g;ctx.beginPath();ctx.moveTo(x(i-1),y(s1));ctx.lineTo(x(i),y(s2));ctx.stroke()}
 ctx.fillStyle='#9cb7ca';ctx.fillText('الزمن →',W-74,H-14);ctx.save();ctx.translate(14,95);ctx.rotate(-Math.PI/2);ctx.fillText('km/h',0,0);ctx.restore();
}
load.onclick=async()=>{sd.value=normalizeSmartDate(sd.value);ed.value=normalizeSmartDate(ed.value);st.value=normalizeSmartTime(st.value);et.value=normalizeSmartTime(et.value);let sv=iso(sd.value,st.value),ev=iso(ed.value,et.value);if(!sv||!ev)return alert('تأكد من التاريخ والوقت');let x=await(await fetch('/api/history/{{device.platform_id}}?start='+encodeURIComponent(sv)+'&end='+encodeURIComponent(ev),{cache:'no-store'})).json();if(x.error)return alert(x.error);pts=x.points;stops.clearLayers();drawRoute();drawChart();x.stops.forEach(q=>L.circleMarker([q.latitude,q.longitude],{radius:8,color:'#9ed7ea'}).bindPopup('توقف<br>من: '+fd(q.from)+'<br>إلى: '+fd(q.to)+'<br>المدة: '+q.minutes+' دقيقة').addTo(stops));summary.textContent='عدد نقاط GPS: '+pts.length+' · عدد التوقفات: '+x.stops.length};
play.onclick=()=>{if(!pts.length)return;let i=0;if(car)m.removeLayer(car);car=L.marker([pts[0].latitude,pts[0].longitude]).addTo(m);let t=setInterval(()=>{if(++i>=pts.length)return clearInterval(t);car.setLatLng([pts[i].latitude,pts[i].longitude]);m.panTo(car.getLatLng())},500)};show.onchange=()=>show.checked?stops.addTo(m):m.removeLayer(stops);window.addEventListener('resize',()=>pts.length&&drawChart());
</script>{% endblock %}
