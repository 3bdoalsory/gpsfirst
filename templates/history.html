{% extends "base.html" %}{% block head %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>{% endblock %}
{% block content %}<div class="page"><div class="page-title"><div><small>TRIP HISTORY</small><h1>{{device.name}} · ID {{device.platform_id}}</h1></div><a class="ghost" href="/dashboard">← العودة</a></div>
<div class="history-toolbar glass"><label>من <span class="date-time-pair"><input id="sd" class="date-input" placeholder="DD/MM/YYYY" inputmode="numeric"><input id="st" class="time-input" placeholder="HH:MM" inputmode="numeric"></span></label><label>إلى <span class="date-time-pair"><input id="ed" class="date-input" placeholder="DD/MM/YYYY" inputmode="numeric"><input id="et" class="time-input" placeholder="HH:MM" inputmode="numeric"></span></label><button id="load">عرض المسار</button><button id="play">▶ تشغيل</button><label><input id="show" type="checkbox" checked> نقاط التوقف</label></div><div id="hmap" class="glass"></div><div id="summary" class="glass summary"></div></div>{% endblock %}
{% block scripts %}<script>
const m=L.map('hmap').setView([33.97,36.67],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);let pts=[],line,car,stops=L.layerGroup().addTo(m);
function iso(d,t){let p=d.trim().split('/');if(p.length!==3||!/^[0-2]?[0-9]:[0-5][0-9]$/.test(t.trim()))return null;return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}T${t.trim()}`};function fd(v){if(!v)return '-';let z=v.replace('T',' ').split(' '),d=z[0].split('-');return d.length===3?`${d[2]}/${d[1]}/${d[0]}${z[1]?' '+z[1].slice(0,5):''}`:v}
load.onclick=async()=>{let sv=iso(sd.value,st.value),ev=iso(ed.value,et.value);if(!sv||!ev)return alert('اكتب التاريخ DD/MM/YYYY والوقت HH:MM');let x=await(await fetch('/api/history/{{device.platform_id}}?start='+encodeURIComponent(sv)+'&end='+encodeURIComponent(ev))).json();if(x.error)return alert(x.error);pts=x.points;if(line)m.removeLayer(line);stops.clearLayers();let a=pts.map(p=>[p.latitude,p.longitude]);if(a.length){line=L.polyline(a,{weight:5,opacity:.85}).addTo(m);m.fitBounds(line.getBounds())}x.stops.forEach(q=>L.circleMarker([q.latitude,q.longitude],{radius:8}).bindPopup('توقف<br>من: '+fd(q.from)+'<br>إلى: '+fd(q.to)+'<br>المدة: '+q.minutes+' دقيقة').addTo(stops));summary.textContent='عدد نقاط GPS: '+pts.length+' · عدد التوقفات: '+x.stops.length};
play.onclick=()=>{if(!pts.length)return;let i=0;if(car)m.removeLayer(car);car=L.marker([pts[0].latitude,pts[0].longitude]).addTo(m);let t=setInterval(()=>{if(++i>=pts.length)return clearInterval(t);car.setLatLng([pts[i].latitude,pts[i].longitude]);m.panTo(car.getLatLng())},500)};show.onchange=()=>show.checked?stops.addTo(m):m.removeLayer(stops);
</script>{% endblock %}
